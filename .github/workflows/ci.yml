name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      # ratelimit/redistore's tests start their own disposable Valkey
      # container through testcontainers-go, the same as running make check
      # locally; no services: block needed here.
      #
      # The checks live in the Makefile so that `make check` locally is the
      # same run as this job. Add a check there, not here.
      - name: make check
        run: make check
