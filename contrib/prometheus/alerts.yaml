# Prometheus alert and recording rules for keel. See docs/breaker.md,
# docs/ratelimit.md and docs/retry.md, "Alerting", for the reasoning behind each threshold. The
# rules assume the default metric namespace "go"; with WithNamespace, rename
# the metrics here to match. Validate with:
#   promtool check rules contrib/prometheus/alerts.yaml
groups:
- name: breaker
  rules:
  # Fraction of instances whose circuit is open. Every breaker exports a
  # closed series, so counting those gives the instance count.
  - record: breaker:open_fraction
    expr: |
      sum by (dependency) (go_breaker_state{state="open"})
        /
      count by (dependency) (go_breaker_state{state="closed"})

  # The dependency is down: most instances agree. Page.
  # The `for` matters: the first open interval is 5s by default, and a
  # single trip that recovers on its first probe must not page anyone.
  # A trip by WithErrorRate lands here like any other; go_breaker_error_rate
  # itself is for dashboards, not for alerting.
  - alert: BreakerOpenFleetWide
    expr: breaker:open_fraction > 0.5
    for: 2m
    labels: { severity: page }
    annotations:
      summary: "{{ $labels.dependency }} circuit open on {{ $value | humanizePercentage }} of instances"

  # Repeated trips: the backend is half-recovering, or IsFailure is counting
  # healthy answers as failures. Someone should look, not at 3am.
  - alert: BreakerFlapping
    expr: sum by (dependency) (increase(go_breaker_trips_total[30m])) > 5
    labels: { severity: ticket }
    annotations:
      summary: "{{ $labels.dependency }} tripped {{ $value }} times in 30m"

  # The user-facing symptom: calls that never ran, whether the circuit or the
  # bulkhead refused them. A ratio, so low-volume paths need no per-service
  # threshold.
  - alert: BreakerSheddingMajority
    expr: |
      sum by (dependency) (rate(go_breaker_calls_total{result=~"rejected|shed"}[5m]))
        /
      sum by (dependency) (rate(go_breaker_calls_total[5m]))
        > 0.5
    for: 5m
    labels: { severity: page }

  # Bulkhead saturation without an open circuit: the backend is slow, not
  # down. Usually a ticket; the timeout and the cap bound the damage. A
  # saturated cap during a recovery ramp is the ramp doing its job, so those
  # are excluded.
  - alert: BreakerBulkheadSaturated
    expr: |
      max by (dependency) (
        (go_breaker_in_flight / go_breaker_in_flight_limit >= 1)
          unless on (dependency, instance) go_breaker_ramping == 1
      )
    for: 5m
    labels: { severity: ticket }

  # Guard: a forgotten Register or a service that never created the breaker
  # looks exactly like "everything is fine". "db-fallback" is a placeholder:
  # one such rule per dependency you expect to see.
  - alert: BreakerMetricsAbsent
    expr: absent(go_breaker_state{dependency="db-fallback"})
    for: 10m
    labels: { severity: ticket }

- name: ratelimit
  rules:
  # Share of decisions refused, per limiter. High and sustained on an inbound
  # limiter means a client is being throttled hard: a ticket to look at who,
  # or at whether the quota is right. On an outbound limiter it means you are
  # the one over quota.
  - alert: RateLimitRefusingMajority
    expr: |
      sum by (limiter) (rate(go_ratelimit_decisions_total{result="limited"}[5m]))
        /
      sum by (limiter) (rate(go_ratelimit_decisions_total[5m]))
        > 0.5
    for: 10m
    labels: { severity: ticket }

  # A distributed limiter that cannot decide: Redis unreachable or replying
  # oddly. The middleware fails open by default, so this is the only signal.
  - alert: RateLimitErrors
    expr: sum by (limiter) (rate(go_ratelimit_decisions_total{result="error"}[5m])) > 0
    for: 2m
    labels: { severity: page }

- name: retry
  rules:
  # Retries per call: attempts beyond the first, over calls. Attempts are
  # counted when they start and calls when they end, so the ratio is exact
  # only over a window longer than a call, which 5m is. Hedges are attempts
  # too, so a hedging retrier is held to the same amplification bound; no
  # separate rule is needed for them.
  - record: retry:retries_per_call
    expr: |
      (
        sum by (retrier) (rate(go_retry_attempts_total[5m]))
          -
        sum by (retrier) (rate(go_retry_calls_total[5m]))
      )
        /
      sum by (retrier) (rate(go_retry_calls_total[5m]))

  # Most calls are being retried: the dependency is degraded and retries are
  # now a large share of its load, or WithRetryIf is retrying answers. A
  # ticket, because the attempt cap and the budget bound the damage.
  - alert: RetryAmplifying
    expr: retry:retries_per_call > 0.5
    for: 10m
    labels: { severity: ticket }
    annotations:
      summary: "{{ $labels.retrier }} averages {{ $value | humanize }} retries per call"

  # The user-facing symptom: calls that failed after every attempt. The
  # dependency has been down for longer than the schedule spans.
  - alert: RetryExhausting
    expr: |
      sum by (retrier) (rate(go_retry_calls_total{result="exhausted"}[5m]))
        /
      sum by (retrier) (rate(go_retry_calls_total[5m]))
        > 0.1
    for: 5m
    labels: { severity: page }
